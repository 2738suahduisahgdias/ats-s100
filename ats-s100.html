R.pkChart = function(){
  const W=560,H=250,pad=46;
  const all = DATA.pk.real.concat(DATA.pk.sim);
  const min=Math.min.apply(null,all), max=Math.max.apply(null,all);
  const x=i=>pad+(W-pad-14)*(i/(DATA.pk.labels.length-1));
  const y=v=>14+(H-40)*(1-(v-min)/(max-min));
  const line=(arr,color)=>arr.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const ticks=[];
  for(let t=0;t<=4;t++){ const v=min+(max-min)*t/4; const yy=y(v); ticks.push('<line x1="'+pad+'" y1="'+yy+'" x2="'+(W-14)+'" y2="'+yy+'" stroke="#1d2a42" stroke-width="1"/><text x="'+(pad-6)+'" y="'+(yy+4)+'" fill="#5d6b85" font-size="10" text-anchor="end">'+(v/10000).toFixed(2)+'万</text>'); }
  const labels=DATA.pk.labels.map((l,i)=>'<text x="'+x(i)+'" y="'+(H-18)+'" fill="#5d6b85" font-size="10" text-anchor="middle">'+l+'</text>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;background:#0d1522;border-radius:8px">'
    +ticks.join("")
    +'<path d="'+line(DATA.pk.sim,"#4ea1ff")+'" fill="none" stroke="#4ea1ff" stroke-width="2" stroke-dasharray="6 4"/>'
    +'<path d="'+line(DATA.pk.real,"#f04a55")+'" fill="none" stroke="#f04a55" stroke-width="2"/>'
    +DATA.pk.real.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="#f04a55"/>').join("")
    +labels
    +'<text x="'+(W-150)+'" y="26" fill="#f04a55" font-size="11">真实仓</text>'
    +'<text x="'+(W-90)+'" y="26" fill="#4ea1ff" font-size="11">AI模拟仓</text>'
    +'<text x="'+(W/2)+'" y="'+(H/2)+'" fill="#2c3a58" font-size="20" text-anchor="middle" font-weight="bold">模拟数据</text>'
    +'</svg>';
};

R.kline = function(){
  let seed=42; const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
  const n=30, W=640, H=230, pad=10; let p=28.2; const cs=[];
  for(let i=0;i<n;i++){ const o=p; const c=o+(rnd()-0.46)*1.1; const h=Math.max(o,c)+rnd()*0.5; const l=Math.min(o,c)-rnd()*0.5; cs.push({o:o,h:h,l:l,c:c}); p=c; }
  cs[n-1].c=29.89; cs[n-1].h=Math.max(cs[n-1].h,29.95);
  const all=cs.flatMap(k=>[k.h,k.l]); const mn=Math.min.apply(null,all), mx=Math.max.apply(null,all);
  const cw=(W-pad*2)/n, bw=cw*0.55;
  const y=v=>pad+(H-pad*2)*(1-(v-mn)/(mx-mn));
  let g="";
  cs.forEach((k,i)=>{
    const x=pad+cw*i+cw/2, up=k.c>=k.o, col=up?"#f04a55":"#2fbf71";
    g+='<line x1="'+x+'" y1="'+y(k.h)+'" x2="'+x+'" y2="'+y(k.l)+'" stroke="'+col+'" stroke-width="1"/>';
    const top=y(Math.max(k.o,k.c)), hh=Math.max(2,Math.abs(y(k.o)-y(k.c)));
    g+='<rect x="'+(x-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+hh+'" fill="'+col+'" rx="1"/>';
  });
  const mark=(v,col,txt)=>{const yy=y(v);return '<line x1="'+pad+'" y1="'+yy+'" x2="'+(W-pad)+'" y2="'+yy+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="5 4"/><text x="'+(W-pad-4)+'" y="'+(yy-4)+'" fill="'+col+'" font-size="10" text-anchor="end">'+txt+' '+v.toFixed(2)+'</text>';};
  const buyX=pad+cw*(n-6)+cw/2, sellX=pad+cw*(n-3)+cw/2;
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;background:#0d1522;border-radius:8px">'+g
    +mark(30.20,"#f0b354","压力")+mark(28.50,"#4ea1ff","支撑")
    +'<circle cx="'+buyX+'" cy="'+(y(29.84)-14)+'" r="7" fill="#f04a55"/><text x="'+buyX+'" y="'+(y(29.84)-20)+'" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">B</text>'
    +'<circle cx="'+sellX+'" cy="'+(y(30.05)-14)+'" r="7" fill="#2fbf71"/><text x="'+sellX+'" y="'+(y(30.05)-20)+'" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">S</text>'
    +'<text x="'+(W/2)+'" y="'+(H/2+30)+'" fill="#2c3a58" font-size="16" text-anchor="middle" font-weight="bold">模拟数据</text></svg>';
};

    +'<div class="card">'+pipe
    +'<div style="margin-top:14px;font-size:12px;color:#7c8aa5">状态流转：计划（盘前生成）→ 触发（行情条件满足）→ 委托（按当时可验证价格下单）→ 成交（撮合确认）→ 复盘（归因归档）。当前示例订单处于「委托」阶段。</div></div>'
    +'<div class="section-title">交易归因字段（每笔交易强制建档）</div><div class="card">'+attr+'</div>'
    +'<div class="section-title">条件单列表</div>'
    +tableWrap('<table><thead><tr><th>标的</th><th>类型</th><th>触发条件</th><th>数量</th><th>状态</th><th>创建时间</th></tr></thead><tbody>'+condRows+'</tbody></table>')
    +'<div class="section-title">模拟成交台账（AI模拟仓）</div>'
    +'<div class="card"><div class="empty-state"><div class="big">尚无成交</div><div>AI模拟仓从 ¥150,000 现金开始，当前 0 仓位、0 成交。<br>首笔成交将在此逐笔登记，并强制携带完整归因字段。</div></div></div>';
};

R.review = function(){
  let html = R.subtabs([{id:"log",name:"复盘日志"},{id:"perf",name:"双仓表现"},{id:"style",name:"风格实验室"}]);
  if(state.sub==="log"){
    html += '<div class="card"><div class="timeline" style="margin-top:4px">'+DATA.reviews.map(r=>'<div class="tl-item"><div class="d">'+r.date+' · '+r.wday+'</div><div class="t"><ul style="list-style:none;margin-top:4px">'+r.items.map(i=>'<li style="margin:5px 0 5px 2px;line-height:1.7">· '+i+'</li>').join("")+'</ul></div></div>').join("")+'</div></div>';
  } else if(state.sub==="perf"){
    const rows = DATA.pk.metrics.map(m=>'<tr><td>'+m.k+'</td><td class="num"><b>'+m.real+'</b></td><td class="num" style="color:#4ea1ff"><b>'+m.sim+'</b></td><td class="dim">'+m.remark+'</td></tr>').join("");
    html += '<div class="card"><h3>双仓净值曲线 <span class="watermark">模拟数据</span></h3>'+R.pkChart()+'</div>'
      +'<div class="section-title">绩效指标</div>'
      +tableWrap('<table class="metric-compare"><thead><tr><th>指标</th><th>真实仓（基准 ¥147,530.17 @10-16）</th><th>AI模拟仓（¥150,000 现金）</th><th>备注</th></tr></thead><tbody>'+rows+'</tbody></table>');
  } else {
    const rows = DATA.styleLabAll.map(s=>'<tr><td><b>'+s.name+'</b> <span class="dim mono">'+s.code+'</span></td><td class="num up">'+s.a+'</td><td class="num up">'+s.b+'</td><td class="num up">'+s.c+'</td><td class="num up">'+s.d+'</td><td class="dim">'+s.fly+'</td></tr>').join("");
    html += '<div class="note" style="margin-bottom:14px">四种交易风格在同一标的上按同一历史区间回放对比：A 趋势持有 / B 中期波段 / C 短线高抛低吸 / D 突破跟随。<span class="watermark">模拟数据</span></div>'
      +tableWrap('<table><thead><tr><th>标的</th><th>A 趋势持有</th><th>B 中期波段</th><th>C 短线高抛低吸</th><th>D 突破跟随</th><th>卖飞风险（A/B/C/D）</th></tr></thead><tbody>'+rows+'</tbody></table>')
      +'<div class="note" style="margin-top:12px">卖飞风险记账说明：风格实验室对每一次卖出单独记账——若卖出后 20 个交易日内涨幅超过 8% 计一次「卖飞」，按次数与错失幅度折算风险等级（低/中/高）。该指标与收益率同等权重纳入风格选择，防止仅凭收益率选风格而系统性踏空主升浪。</div>';
  }
  return html;
};

R.system = function(){
  const srcRows = DATA.sources.map(s=>'<tr><td><b>'+s.name+'</b></td><td class="dim">'+s.scope+'</td><td>'+badge(s.status,s.status==="正常"?"green":(s.status==="同步中"?"gold":"gray"))+'</td><td class="num">'+s.time+'</td><td class="dim" style="white-space:normal">'+s.note+'</td></tr>').join("");
  const taskRows = DATA.tasks.map(t=>'<tr class="'+(t.title?"hl-row":"")+'"><td class="num"><b>'+t.time+'</b></td><td><b>'+t.name+'</b>'+(t.title?' '+badge("标题模块","blue"):"")+'</td><td class="dim" style="white-space:normal">'+t.desc+'</td><td>'+badge(t.status,"green")+'</td><td class="num">至 '+t.until+'</td></tr>').join("");
  const v = DATA.version;
  return '<div class="grid g2"><div>'
    +'<div class="section-title" style="margin-top:16px">数据源状态</div>'
    +tableWrap('<table><thead><tr><th>数据源</th><th>范围</th><th>状态</th><th>最近同步</th><th>备注</th></tr></thead><tbody>'+srcRows+'</tbody></table>')
    +'<div class="section-title">同步 / 台账状态</div>'
    +'<div class="card"><div class="grid g2" style="grid-template-columns:1fr 1fr">'
    +'<div><div class="dim" style="font-size:11.5px">模拟成交台账</div><div style="font-size:15px;font-weight:600;margin-top:4px;color:#4ea1ff">'+DATA.ledger.simState+'</div></div>'
    +'<div><div class="dim" style="font-size:11.5px">近5日真实成交笔数</div><div class="num" style="font-size:20px;font-weight:700;margin-top:4px">'+DATA.ledger.realFills5d+' 笔</div></div>'
    +'<div><div class="dim" style="font-size:11.5px">上次同步</div><div class="num" style="margin-top:4px">'+DATA.ledger.lastSync+'</div></div>'
    +'<div><div class="dim" style="font-size:11.5px">下次同步</div><div class="num" style="margin-top:4px">'+DATA.ledger.nextSync+'</div></div>'
    +'</div></div></div><div>'
    +'<div class="section-title" style="margin-top:16px">定时任务（有效期内至 2027-02-05）</div>'
    +tableWrap('<table><thead><tr><th>时间</th><th>任务</th><th>内容</th><th>状态</th><th>有效期</th></tr></thead><tbody>'+taskRows+'</tbody></table>')
    +'<div class="section-title">版本信息</div>'
    +'<div class="card"><div style="display:flex;gap:24px;align-items:center"><div><div class="num" style="font-size:30px;font-weight:800;color:#4ea1ff">'+v.ver+'</div><div class="dim" style="font-size:11.5px;margin-top:4px">build '+v.build+'</div></div>'
    +'<div style="flex:1"><div class="dim" style="font-size:12px;line-height:1.8">策略规则版本化：'+v.note+'</div></div></div></div>'
    +'<div class="card" style="margin-top:12px"><h3>离线说明</h3><div class="dim" style="font-size:12px;line-height:1.8">本页面为完全离线的静态原型：无任何网络请求、无外部依赖，全部数据以静态 Mock 形式内嵌于单文件，仅用于产品形态与信息架构验证。</div></div>'
    +'</div></div>';
};

const titles = {overview:"总览驾驶舱",radar:"选股雷达",research:"个股研究",strategy:"AI策略中心",trade:"交易计划",review:"复盘与回测",system:"系统状态"};
function render(){
  document.getElementById("nav").innerHTML = R.nav();
  document.getElementById("page-title").textContent = titles[state.module];
  let html = R[state.module]();
  html += '<div class="disclaimer">本系统为模拟交易与研究工具，不构成投资建议。</div>';
  document.getElementById("page").innerHTML = html;
  const si = document.getElementById("searchInput");
  if(si){ si.addEventListener("input", e=>{ state.search=e.target.value; const pos=si.selectionStart; render(); const el=document.getElementById("searchInput"); el.focus(); el.setSelectionRange(pos,pos); }); }
  if(location.hash !== "#"+state.module+"/"+state.sub) history.replaceState(null,"","#"+state.module+"/"+state.sub);
}
function route(){
  const h = location.hash.replace(/^#/,"");
  const parts = h.split("/");
  if(parts[0] && DATA.modules.some(m=>m.id===parts[0])){ state.module=parts[0]; state.detail=null; }
  if(parts[1]) state.sub=parts[1];
  render();
}
document.getElementById("nav").addEventListener("click", e=>{
  const it = e.target.closest(".navitem"); if(!it) return;
  state.module=it.dataset.mod; state.sub = state.module==="overview"?"real":(state.module==="radar"?"macro":(state.module==="review"?"log":"main"));
  state.detail=null; state.detailTab=0; render();
});
document.getElementById("page").addEventListener("click", e=>{
  const sub = e.target.closest("[data-sub]"); if(sub){ state.sub=sub.dataset.sub; render(); return; }
  const rt = e.target.closest("[data-rt]"); if(rt){ state.researchTab=rt.dataset.rt; render(); return; }
  const hz = e.target.closest("[data-hz]"); if(hz){ state.horizon=hz.dataset.hz; render(); return; }
  const dt = e.target.closest("[data-dt]"); if(dt){ state.detailTab=+dt.dataset.dt; render(); return; }
  if(e.target.closest("#backBtn")){ state.detail=null; state.detailTab=0; render(); return; }
  const row = e.target.closest("tr.clickrow"); if(row && row.dataset.code){ state.detail=row.dataset.code; state.detailTab=0; state.module="research"; render(); }
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
